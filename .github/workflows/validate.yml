name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验技能结构
        run: ./scripts/validate.sh

      - name: 校验 marketplace.json
        run: ./scripts/validate-marketplace.sh

      - name: 对官方 schema 校验清单（尽力而为）
        continue-on-error: true
        run: |
          # 需要联网取 schema，失败不影响结论——上面的本地校验才是权威
          pip install --quiet jsonschema
          curl -sSL --max-time 20 https://www.schemastore.org/claude-code-marketplace.json -o /tmp/mkt-schema.json
          python3 -c "import json, jsonschema, sys; s=json.load(open('/tmp/mkt-schema.json')); d=json.load(open('.claude-plugin/marketplace.json')); e=sorted(jsonschema.Draft202012Validator(s).iter_errors(d), key=lambda x: list(x.path)); [print('::warning::marketplace.json %s: %s' % ('.'.join(map(str, x.path)), x.message)) for x in e]; print('schema 校验通过' if not e else '%d 处与 schema 不符' % len(e))"

      - name: 冒烟测试安装脚本
        run: |
          ./scripts/install.sh --list

          # 至少存在一个真技能
          first=$(find skills -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | head -1)
          if [ -z "$first" ]; then
            echo "::error::skills/ 下没有可安装的技能"; exit 1
          fi

          # --list 必须列出每个技能
          for d in skills/*/; do
            name=$(basename "$d")
            ./scripts/install.sh --list | grep -qx "  $name" || {
              echo "::error::--list 未列出技能 $name"; exit 1; }
          done

          # --all 装全部；--force 的退出码应为 0
          ./scripts/install.sh --all --target "$RUNNER_TEMP/skills" --force
          test -f "$RUNNER_TEMP/skills/$first/SKILL.md"

          # 装上的技能数应与 skills/ 下的目录数一致
          installed=$(find "$RUNNER_TEMP/skills" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          expected=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          test "$installed" = "$expected" || {
            echo "::error::装了 $installed 个技能，skills/ 下有 $expected 个"; exit 1; }

          # 指定不存在的技能必须非零退出
          if ./scripts/install.sh no-such-skill --target "$RUNNER_TEMP/skills" >/dev/null 2>&1; then
            echo "::error::安装不存在的技能应返回非零退出码"; exit 1
          fi
